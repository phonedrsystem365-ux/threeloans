<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>三貸同堂｜免費額度初評與月付試算</title>
  <meta name="description" content="不拉銀行聯徵、核准對保前 0 元收費、全程保密，點擊立即啟動三貸同堂專屬免費額度初評。">
  <!-- LINE / 社群分享預覽卡片設定（請確認 logo.jpg 已上傳至 GitHub threeloans 根目錄） -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="三貸同堂｜60秒免費額度初評">
  <meta property="og:description" content="不拉聯徵、全程保密、核准對保前 0 元收費，點此立即開啟專屬免費評估。">
  <meta property="og:image" content="https://phonedrsystem365-ux.github.io/threeloans/logo.jpg">
  <style>
    :root {
      --bg-base: #FAF7F2;
      --card-bg: #FFFFFF;
      --primary: #C8A882;
      --primary-dark: #A6845E;
      --text-main: #3E3024;
      --text-sub: #7A6A5B;
      --line-green: #06C755;
      --line-green-dark: #05A948;
      --calc-amber: #C58940;
      --calc-amber-dark: #A86F2B;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid rgba(200, 168, 130, 0.35);
      border-radius: 22px;
      padding: 36px 26px 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(62, 48, 36, 0.08);
    }
    .brand-logo {
      width: 132px;
      height: auto;
      margin: 0 auto 14px;
      display: block;
      border-radius: 12px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .brand-sub {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 22px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(200, 168, 130, 0.25);
      border-top-color: var(--primary-dark);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 10px;
    }
    .ref-badge {
      display: inline-block;
      background: #F4ECE1;
      color: #6B4F35;
      border: 1px solid rgba(200, 168, 130, 0.5);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .btn-action {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background-color: var(--line-green);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(6, 199, 85, 0.28);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn-action:active {
      background-color: var(--line-green-dark);
      transform: scale(0.98);
    }
    .btn-action.btn-calc {
      background-color: var(--calc-amber);
      box-shadow: 0 6px 16px rgba(197, 137, 64, 0.28);
    }
    .btn-action.btn-calc:active {
      background-color: var(--calc-amber-dark);
    }
    .tip {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-sub);
    }
    .footer-note {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid rgba(200, 168, 130, 0.25);
      font-size: 12px;
      color: #9A8B7C;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="../logo.jpg" alt="三貸同堂" class="brand-logo" onerror="this.style.display='none'">
    <div class="brand-title">三貸同堂</div>
    <div id="brandSub" class="brand-sub">正在為您開啟官方 LINE 免費額度初評</div>

    <div class="spinner" aria-hidden="true"></div>
    <div id="statusText" class="status-text">系統快速導向中，請稍候...</div>
    <div id="refBadge" class="ref-badge" style="display:none;"></div>

    <a id="manualBtn" class="btn-action" href="https://line.me/R/oaMessage/%40threeloans/?%E6%88%91%E8%A6%81%E5%85%8D%E8%B2%BB%E9%A1%8D%E5%BA%A6%E5%88%9D%E8%A9%95">
      立即開啟 LINE 領取初評
    </a>

    <p id="tipText" class="tip">
      若未自動跳轉，請點擊上方綠色按鈕；<br>
      進入官方帳號後直接按下「傳送」即可完成歸戶。
    </p>

    <div class="footer-note">三貸同堂・全雲端智能管家系統</div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);

      // 推薦碼相容 ?c= / ?ref= / ?code=
      var rawCode = (params.get('c') || params.get('ref') || params.get('code') || '').trim();
      var safeCode = rawCode.replace(/[^\w\-一-龥]/g, '').slice(0, 32);

      // 目標類型：預設 LINE 官方帳號初評；支援 ?t=calc / resume / esign / client
      var targetType = (params.get('t') || params.get('to') || 'line').trim().toLowerCase();

      var targetUrl = '';
      var subEl = document.getElementById('brandSub');
      var statusEl = document.getElementById('statusText');
      var btnEl = document.getElementById('manualBtn');
      var tipEl = document.getElementById('tipText');
      var badgeEl = document.getElementById('refBadge');

      if (safeCode && badgeEl) {
        badgeEl.textContent = '專屬推薦碼：' + safeCode;
        badgeEl.style.display = 'inline-block';
      }

      if (targetType === 'calc' || targetType === 'resume' || targetType === 'esign' || targetType === 'client') {
        var qs = [];
        if (targetType !== 'client') {
          qs.push('tab=' + encodeURIComponent(targetType));
        }
        if (safeCode) {
          qs.push('ref=' + encodeURIComponent(safeCode));
        }
        qs.push('openExternalBrowser=1');
        targetUrl = '../index.html?' + qs.join('&');

        if (subEl) subEl.textContent = '正在為您開啟 60 秒免費月付試算與初評';
        if (btnEl) {
          btnEl.textContent = '立即開啟 60 秒免費試算';
          btnEl.classList.add('btn-calc');
          btnEl.href = targetUrl;
        }
        if (tipEl) {
          tipEl.innerHTML = '若未自動跳轉，請點擊上方按鈕；<br>填寫初評不拉聯徵，核准對保前 0 元收費。';
        }
      } else {
        // 預設指向正式藍盾 @threeloans；測試環境透過 GAS 自動帶 ?oa=@xxxx 切換
        var rawOa = (params.get('oa') || '@threeloans').trim();
        var oaId = rawOa.indexOf('@') === 0 ? rawOa : ('@' + rawOa);

        var messageText = safeCode
          ? '我要免費額度初評（專屬推薦碼：' + safeCode + '）'
          : '我要免費額度初評';

        targetUrl = 'https://line.me/R/oaMessage/' +
          encodeURIComponent(oaId) + '/?' +
          encodeURIComponent(messageText);

        if (btnEl) {
          btnEl.href = targetUrl;
        }
      }

      // 毫秒導向目標連結
      window.location.replace(targetUrl);

      // 若被 App 內建瀏覽器阻擋自動跳轉，1.8 秒後改顯示手動點擊提示
      window.setTimeout(function () {
        if (statusEl) {
          statusEl.textContent = '請點擊下方按鈕立即前往';
        }
      }, 1800);
    })();
  </script>
</body>
</html>
